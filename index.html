<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>portfolio</title>
  <meta name="description" content="Portfolio — XR, technical art, VFX, computer vision.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="top">
    <div class="switches">
      <button class="theme" id="theme" type="button"></button>
      <button class="lang" id="lang" type="button"></button>
    </div>
    <div class="hero">
      <a href="./" class="name" id="site-name"></a>
      <canvas id="moon" aria-label="luna" role="img"></canvas>
    </div>
    <p class="role" id="site-role"></p>
    <p class="docs" id="docs"></p>
  </header>

  <section class="manifesto about-top">
    <span class="date" id="about-label">about</span>
    <p id="manifesto"></p>
  </section>

  <nav class="filters" id="filters" aria-label="filtri"></nav>

  <main id="feed" class="feed"></main>

  <section class="theater" id="theater" aria-label="ascii theater">
    <div class="t-head">
      <span class="date">ascii theater</span>
      <span class="now"></span>
      <span class="t-ctrl">
        <button class="t-prev" type="button" aria-label="previous">◀</button>
        <button class="t-play" type="button"></button>
        <button class="t-next" type="button" aria-label="next">▶</button>
      </span>
    </div>
    <pre class="screen" aria-hidden="true"></pre>
    <div class="t-foot">
      <span class="meta"></span>
      <a href="https://ascii.theater/" target="_blank" rel="noopener">ispirato ad ascii.theater ↗</a>
    </div>
  </section>

  <footer class="bottom">
    <div class="foot">
      <span id="copy"></span>
      <span id="contacts" class="contacts"></span>
    </div>
  </footer>

  <div id="peek" class="peek" aria-hidden="true"></div>

  <script src="projects.js"></script>
  <script src="main.js"></script>
  <script src="assets/moon/texture.js"></script>
  <script src="moon.js"></script>
  <script src="theater.js"></script>
  <script src="ascii.js"></script>
</body>
</html>
